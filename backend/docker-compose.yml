services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: omniva
      POSTGRES_USER: omniva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local disposable DB}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniva -d omniva"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - omniva-postgres:/var/lib/postgresql
volumes:
  omniva-postgres:
