name: Phase 4C isolated tests
on:
  pull_request:
  push:
    branches: [main, feat/integration-qa-deploy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase4c:
    if: hashFiles('backend/features/tests/test_phase4c.py') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: uv
          cache-dependency-path: backend/uv.lock
      - uses: astral-sh/setup-uv@e92bafb625e3c0a3da646bd9c8f82d9777aa67d3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra test
      - name: Isolated Phase 4C tests (no API/React registration)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: backend
        run: uv run pytest features/tests/test_phase4c.py -q --noconftest -p no:cacheprovider --junitxml=../work/qa-results/phase4c-junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase4c-reports
          path: work/qa-results/phase4c-junit.xml
          if-no-files-found: ignore
          retention-days: 14
  report:
    if: always()
    needs: phase4c
    runs-on: ubuntu-latest
    steps:
      - env:
          JOB_RESULT: ${{ needs.phase4c.result }}
        run: |
          echo "Phase 4C isolated module suite: $JOB_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$JOB_RESULT" = skipped ]; then
            echo "SKIPPED: Phase 4C test module is not part of this checkout." >> "$GITHUB_STEP_SUMMARY"
          fi
