name: omniva-phase5b-qa
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: omniva_qa
      POSTGRES_USER: omniva
      POSTGRES_PASSWORD: qa_only_disposable
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniva -d omniva_qa"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  pgdata:
